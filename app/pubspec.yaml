name: daily_games
description: "Four small puzzles a day — Zip, Tango, Sudoku and Number Merge."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.11.1
  shared_preferences: ^2.5.3
  flutter_local_notifications: ^23.0.4
  timezone: ^0.11.2
  flutter_timezone: ^4.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/OFL.txt
  fonts:
    - family: SourceSerif4
      fonts:
        - asset: assets/fonts/SourceSerif4-400.ttf
          weight: 400
        - asset: assets/fonts/SourceSerif4-500.ttf
          weight: 500
        - asset: assets/fonts/SourceSerif4-600.ttf
          weight: 600
        - asset: assets/fonts/SourceSerif4-700.ttf
          weight: 700
